name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  ios-build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS
        run: flutter build ios --release --no-codesign