name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  ios-build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Diagnose iOS configuration
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo ""
          echo "===== Xcode ====="
          xcodebuild -version

          echo ""
          echo "===== Podfile ====="
          cat ios/Podfile

          echo ""
          echo "===== Deployment targets ====="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj

          echo ""
          echo "===== Flutter Podspec ====="
          find "$FLUTTER_ROOT" -name "Flutter.podspec" -print -exec grep -n "deployment_target" {} \;

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS
        run: flutter build ios --release --no-codesign