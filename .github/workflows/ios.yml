name: iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Execute workflow?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

      action:
        description: "What should happen?"
        required: true
        type: choice
        options:
          - "build"
          - "testflight"
          - "appstore"
        default: "build"

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - "debug"
          - "release"
        default: "release"
      build_number:
        description: "iOS build number (must be higher than the previous App Store Connect build)"
        required: true
        type: string
        default: "8"

      production_confirm:
        description: "For App Store only: type PUBLISH"
        required: false
        type: string
        default: ""

jobs:
  ios-build:
    name: iOS Build
    runs-on: macos-15

    steps:

      # ==========================================================
      # 1. CHECK EXECUTION
      # ==========================================================

      - name: Check execution flag
        if: ${{ inputs.execute == 'no' }}
        run: |
          echo "Execution disabled."
          echo "No build, signing, or upload will be performed."

      # ==========================================================
      # 2. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        if: ${{ inputs.execute == 'yes' }}
        uses: actions/checkout@v6

      # ==========================================================
      # 2.5 SELECT XCODE
      # ==========================================================

      - name: Select Xcode 26.3
        if: ${{ inputs.execute == 'yes' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

          echo "Selected Xcode:"
          xcodebuild -version

          echo "Available iOS SDK:"
          xcodebuild -showsdks | grep -A 2 "iOS SDKs"


      # ==========================================================
      # 3. FLUTTER
      # ==========================================================

      - name: Set up Flutter
        if: ${{ inputs.execute == 'yes' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          cache: true

      - name: Show Flutter version
        if: ${{ inputs.execute == 'yes' }}
        run: flutter --version

      # ==========================================================
      # 4. FLUTTER DEPENDENCIES
      # ==========================================================

      - name: Flutter pub get
        if: ${{ inputs.execute == 'yes' }}
        run: flutter pub get

      # ==========================================================
      # 5. COCOAPODS
      # ==========================================================

      - name: Install CocoaPods dependencies
        if: ${{ inputs.execute == 'yes' }}
        working-directory: ios
        run: pod install

      # ==========================================================
      # 6. DEBUG BUILD
      # ==========================================================

      - name: Build iOS Debug
        if: >
          inputs.execute == 'yes' &&
          inputs.action == 'build' &&
          inputs.build_type == 'debug'
        run: |
          flutter build ios \
            --debug \
            --no-codesign

      # ==========================================================
      # 7. UNSIGNED RELEASE BUILD
      # ==========================================================

      - name: Build iOS Release
        if: >
          inputs.execute == 'yes' &&
          inputs.action == 'build' &&
          inputs.build_type == 'release'
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # ==========================================================
      # 8. CHECK APP STORE CONFIRMATION
      # ==========================================================

      - name: Check App Store confirmation
        if: >
          inputs.execute == 'yes' &&
          inputs.action == 'appstore'
        run: |

          if [ "${{ inputs.build_type }}" != "release" ]; then
            echo "ERROR: App Store builds must use Release."
            exit 1
          fi

          if [ "${{ inputs.production_confirm }}" != "PUBLISH" ]; then
            echo "ERROR: App Store publishing requires PUBLISH."
            exit 1
          fi

          echo "Production publishing confirmed."

      # ==========================================================
      # 9. CREATE TEMPORARY KEYCHAIN
      # ==========================================================

      - name: Create temporary signing keychain
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db" \
            "/Library/Keychains/System.keychain"

          security default-keychain -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # 10. INSTALL DISTRIBUTION CERTIFICATE
      # ==========================================================

      - name: Install Apple Distribution certificate
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"

          echo "$CERTIFICATE_BASE64" |
            tr -d '\r\n ' |
            base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$CERTIFICATE_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Distribution certificate installed."

      # ==========================================================
      # 11. INSTALL PROVISIONING PROFILE
      # ==========================================================

      - name: Install App Store provisioning profile
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |

          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"

          printf '%s' "$PROFILE_BASE64" |
            base64 --decode > "$PROFILE_PATH"

          PROFILE_UUID=$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract UUID raw -
          )

          PROFILE_NAME=$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract Name raw -
          )

          PROFILE_APP_ID=$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract Entitlements.application-identifier raw -
          )

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Provisioning profile installed."
          echo "Profile: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Application ID: $PROFILE_APP_ID"

      # ==========================================================
      # 12. VERIFY SIGNING IDENTITY
      # ==========================================================

      - name: Verify Apple Distribution certificate
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        run: |

          echo "Available code signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"
          
          

      # ==========================================================
      # 12.5 CONFIGURE XCODE DISTRIBUTION SIGNING
      # ==========================================================

      - name: Configure Xcode distribution signing
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        run: |

          echo "Configuring Xcode for manual distribution signing..."

          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          text = text.replace(
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";'
          )

          text = text.replace(
              'CODE_SIGN_IDENTITY = "iPhone Developer";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";'
          )

          text = text.replace(
              'CODE_SIGN_IDENTITY = "iOS Developer";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";'
          )

          path.write_text(text)
          PY

          echo "Setting provisioning profile..."
          echo "Profile: $PROVISIONING_PROFILE_NAME"

          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target Runner \
            -configuration Release \
            -showBuildSettings \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=DRTUV4MKYD \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            | grep -E "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE"

      # ==========================================================
      # 13. BUILD SIGNED XCARCHIVE
      # ==========================================================

      - name: Archive iOS App
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        run: |
          
          echo "Creating signed iOS archive..."
          
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          
          rm -rf "$ARCHIVE_PATH"
          
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=DRTUV4MKYD \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            FLUTTER_BUILD_NUMBER="${{ inputs.build_number }}" \
            FLUTTER_BUILD_NAME="4.0.0"
          
          echo "Archive created successfully."
          
          ls -lh "$ARCHIVE_PATH"
          
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Verify archive build number
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        run: |
          echo "Requested build number: ${{ inputs.build_number }}"

          echo "Archive Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :ApplicationProperties:CFBundleShortVersionString" \
            "$ARCHIVE_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :ApplicationProperties:CFBundleVersion" \
            "$ARCHIVE_PATH/Info.plist"

          echo "App Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$ARCHIVE_PATH/Products/Applications/Runner.app/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$ARCHIVE_PATH/Products/Applications/Runner.app/Info.plist"

      # ==========================================================
      # 14. EXPORT SIGNED IPA
      # ==========================================================

      - name: Export IPA
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        run: |
          
          echo "Exporting signed IPA..."
          
          rm -rf build/ios/ipa
          
          mkdir -p build/ios/ipa
          
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist
          
          echo "IPA export completed."
          
          find build/ios/ipa \
            -maxdepth 2 \
            -type f \
            -print

      # ==========================================================
      # 15. VERIFY IPA
      # ==========================================================

      - name: Find generated IPA
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        run: |

          echo "Generated IPA:"

          find build/ios/ipa \
            -type f \
            -name "*.ipa" \
            -print

      # ==========================================================
      # 16. PREPARE APP STORE CONNECT API KEY
      # ==========================================================

      - name: Prepare App Store Connect API key
        if: >
          inputs.execute == 'yes' &&
          (inputs.action == 'testflight' || inputs.action == 'appstore')
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |

          PRIVATE_KEY_DIR="$HOME/private_keys"

          mkdir -p "$PRIVATE_KEY_DIR"

          printf '%s\n' "$API_PRIVATE_KEY" \
            > "$PRIVATE_KEY_DIR/AuthKey_${API_KEY_ID}.p8"

          chmod 600 \
            "$PRIVATE_KEY_DIR/AuthKey_${API_KEY_ID}.p8"

          echo "API key prepared."

          echo "Checking API key file exists..."

          ls -l "$PRIVATE_KEY_DIR/AuthKey_${API_KEY_ID}.p8"

      # ==========================================================
      # 17. UPLOAD TO TESTFLIGHT
      # ==========================================================

      - name: Upload to TestFlight
        if: >
          inputs.execute == 'yes' &&
          inputs.action == 'testflight'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |

          IPA_PATH=$(find build/ios/ipa -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      # ==========================================================
      # 18. APP STORE UPLOAD
      # ==========================================================

      - name: Upload to App Store Connect
        if: >
          inputs.execute == 'yes' &&
          inputs.action == 'appstore'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |

          IPA_PATH=$(find build/ios/ipa -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      # ==========================================================
      # 19. BUILD-ONLY ARTIFACT
      # ==========================================================

      - name: Package build artifact
        if: >
          inputs.execute == 'yes' &&
          inputs.action == 'build'
        run: |

          mkdir -p artifacts

          cp -R \
            build/ios/iphoneos/Runner.app \
            artifacts/Runner.app

      - name: Upload build artifact
        if: >
          inputs.execute == 'yes' &&
          inputs.action == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.build_type }}-build
          path: artifacts/Runner.app
          retention-days: 7